<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe AI | Minimax Unbeatable Bot</title>
<meta name="description" content="An unbeatable Tic-Tac-Toe AI opponent built with the Minimax algorithm. Week 1 of a 52-week Classical AI challenge.">
<link rel="stylesheet" href="/style.css">
</head>
<body>

  <div class="app">

    <header class="header">
      <h1>Tic-Tac-Toe <span class="accent">AI</span></h1>
      <p class="subtitle">Unbeatable opponent powered by the Minimax algorithm</p>
      <span class="badge">52-Week AI Challenge · Week 1 · Classical AI</span>
    </header>

    <!-- Setup screen: choose symbol & who goes first -->
    <section id="setup-screen" class="panel">
      <h2>Game Setup</h2>

      <div class="setup-group">
        <label>Choose your symbol</label>
        <div class="option-row">
          <button class="option-btn selected" data-choice="symbol" data-value="X">X</button>
          <button class="option-btn" data-choice="symbol" data-value="O">O</button>
        </div>
      </div>

      <div class="setup-group">
        <label>Who goes first?</label>
        <div class="option-row">
          <button class="option-btn selected" data-choice="first" data-value="human">You</button>
          <button class="option-btn" data-choice="first" data-value="ai">AI</button>
        </div>
      </div>

      <button id="start-btn" class="primary-btn">Start Game</button>
    </section>

    <!-- Game screen -->
    <section id="game-screen" class="panel hidden">
      <div class="status-bar">
        <span id="status-text">Your move</span>
      </div>

      <div id="board" class="board">
        <!-- 9 cells injected by JS -->
      </div>

      <div class="stats">
        <div class="stat">
          <span class="stat-label">Nodes explored</span>
          <span id="nodes-stat" class="stat-value">–</span>
        </div>
        <div class="stat">
          <span class="stat-label">Search depth</span>
          <span id="depth-stat" class="stat-value">–</span>
        </div>
      </div>

      <div class="controls">
        <button id="restart-btn" class="secondary-btn">New Game</button>
      </div>
    </section>

  </div>

  <footer class="footer">
    Built by Muhammad Zain with Python · Flask · Minimax &mdash; <a href="https://github.com/Zain-Qadeer/tic-tac-toe-ai/" target="_blank" rel="noopener">View on GitHub</a>
  </footer>

  <script src="/script.js"></script>
</body>
</html>
